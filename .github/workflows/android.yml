name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the Android 37.1 platform
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:domain:test :core:data:testDebugUnitTest

      - name: Debug build and release zip
        # Signed with repository secrets when they exist, otherwise with the public example key.
        env:
          TASKI_KEYSTORE: ${{ secrets.TASKI_KEYSTORE_PATH }}
          TASKI_KEYSTORE_PASSWORD: ${{ secrets.TASKI_KEYSTORE_PASSWORD }}
          TASKI_KEY_ALIAS: ${{ secrets.TASKI_KEY_ALIAS }}
          TASKI_KEY_PASSWORD: ${{ secrets.TASKI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:zipRelease

      - uses: actions/upload-artifact@v4
        with:
          name: taski-release
          path: app/build/dist/*.zip
